# ============================================================
# 智能简历 · nginx 生产配置（Docker Compose）
# ============================================================
# 关键修复：backend/frontend 是 Docker 容器名，容器一旦被重建（docker compose
# up -d --build / 代码更新）就会换 IP，而 upstream 块的 DNS 只在 nginx 启动时
# 解析一次——旧 IP 缓存会导致 502 Bad Gateway，且要手动重启 nginx 才好。
# 改用 Docker 嵌入式 DNS（127.0.0.11，user-defined 网络默认提供）+ 变量
# proxy_pass，每 10s 重新解析一次，后端重建后最多 10s 自动恢复，无需重启 nginx。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # 静态资源压缩（CSView 文档站 JS/CSS 收益明显）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1k;

    # AI 解析 / 优化等接口耗时可达数分钟，放宽代理超时，避免 504
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 后端健康检查直通（/health 不在 /api 前缀下，否则会落到前端）
    location = /health {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CSView 文档站（VuePress 静态站，base=/csview/）
    # 构建产物挂载于 /usr/share/nginx/html/csview（见 docker-compose.yml nginx.volumes）
    location = /csview {
        return 301 /csview/;
    }

    location /csview/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /csview/index.html;
    }

    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
